name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  domain-and-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GJS
        run: sudo apt-get update && sudo apt-get install -y gjs libglib2.0-bin
      - name: Check domain, real storage and source
        run: bash scripts/check.sh
